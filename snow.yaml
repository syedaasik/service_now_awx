---
- name: Connect to ServiceNow
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    servicenow_instance: "https://dev207167.service-now.com"
    servicenow_username: "{{ lookup('env', 'SNOW_USERNAME') }}"
    servicenow_password: "{{ lookup('env', 'SNOW_PASSWORD') }}"

  tasks:
    - name: Test ServiceNow API connection
      ansible.builtin.uri:
        url: "{{ servicenow_instance }}/api/now/table/incident?sysparm_limit=1"
        method: GET
        user: "{{ servicenow_username }}"
        password: "{{ servicenow_password }}"
        force_basic_auth: true
        validate_certs: true
        headers:
          Accept: "application/json"
        status_code: 200
        return_content: true
      register: servicenow_response
      no_log: false

    - name: Display connection status
      ansible.builtin.debug:
        msg: "Successfully connected to ServiceNow."

    - name: Display retrieved incident count
      ansible.builtin.debug:
        msg: "Incidents retrieved: {{ servicenow_response.json.result }}"
